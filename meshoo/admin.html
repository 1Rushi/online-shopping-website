<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - MODA</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: 100vh;
        }
        .admin-sidebar {
            background-color: #000;
            color: #fff;
            padding: 2rem;
        }
        .admin-sidebar h2 {
            font-family: var(--font-heading);
            margin-bottom: 3rem;
            letter-spacing: 2px;
        }
        .admin-nav {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .admin-nav a {
            color: #aaa;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .admin-nav a.active, .admin-nav a:hover {
            color: #fff;
        }
        .admin-main {
            padding: 3rem;
            background-color: var(--bg-light);
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }
        .admin-title {
            font-family: var(--font-heading);
            font-size: 2rem;
        }
        .btn-primary {
            background-color: var(--accent-blue);
            color: #fff;
            border: none;
            padding: 1rem 2rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-primary:hover {
            background-color: #1e40d8;
        }
        .admin-card {
            background: #fff;
            padding: 2.5rem;
            border: 1px solid var(--border-color);
            margin-bottom: 2rem;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        .form-group label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }
        .form-group input, .form-group select {
            padding: 0.9rem;
            border: 1px solid var(--border-color);
            font-family: var(--font-body);
            font-size: 0.9rem;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #000;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 1.2rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
        }
        th {
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
            color: var(--text-light);
            font-size: 0.75rem;
        }
        .td-img img {
            width: 50px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
        }
        .action-btn {
            background: none;
            border: none;
            color: #d9534f;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.3s;
        }
        .action-btn:hover {
            color: #c9302c;
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <h2>MODA<br>ADMIN</h2>
            <nav class="admin-nav">
                <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Site</a>
                <a href="#" id="admin-nav-products" class="active"><i class="fas fa-box"></i> Products</a>
                <a href="#" id="admin-nav-orders"><i class="fas fa-shopping-cart"></i> Orders</a>
                <a href="#"><i class="fas fa-users"></i> Customers</a>
            </nav>
        </aside>

        <main class="admin-main">
            <!-- Products Panel (Visible by default) -->
            <div id="admin-products-panel">
                <div class="admin-header">
                    <h1 class="admin-title">Product Management</h1>
                </div>

                <!-- Upload Form -->
                <div class="admin-card">
                    <h3 style="margin-bottom: 2rem; font-family: var(--font-heading); font-size: 1.5rem;">Upload New Product</h3>
                    <form id="add-product-form">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Product Name</label>
                                <input type="text" id="prod-name" required placeholder="e.g. Italian Wool Blazer">
                            </div>
                            <div class="form-group">
                                <label>Price ($)</label>
                                <input type="number" id="prod-price" required step="0.01" placeholder="295.00">
                            </div>
                            <div class="form-group">
                                <label>Category Section</label>
                                <select id="prod-category">
                                    <option value="Men's">Men's Collection</option>
                                    <option value="Women's">Women's Collection</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Brand</label>
                                <select id="prod-brand">
                                    <option value="MODA ARCHIVE">Moda Archive</option>
                                    <option value="AURA COLLECTIVE">Aura Collective</option>
                                    <option value="ELYSIAN">Elysian</option>
                                    <option value="NORDIC RAW">Nordic Raw</option>
                                </select>
                            </div>
                            <div class="form-group full-width">
                                <label>Main Product Image (Required)</label>
                                <input type="file" id="prod-image" accept="image/*" required style="padding: 0.6rem;">
                            </div>
                            <div class="form-group">
                                <label>Thumbnail 2 (Optional)</label>
                                <input type="file" id="prod-image-2" accept="image/*" style="padding: 0.6rem;">
                            </div>
                            <div class="form-group">
                                <label>Thumbnail 3 (Optional)</label>
                                <input type="file" id="prod-image-3" accept="image/*" style="padding: 0.6rem;">
                            </div>
                        </div>
                        <button type="submit" class="btn-primary" style="margin-top: 1rem;">PUBLISH PRODUCT TO STORE</button>
                    </form>
                </div>

                <!-- Display Uploaded Products -->
                <div class="admin-card">
                    <h3 style="margin-bottom: 1.5rem; font-family: var(--font-heading); font-size: 1.5rem;">Custom Uploaded Products</h3>
                    <table id="custom-products-table">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Brand</th>
                                <th>Price</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Rendered by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Orders Panel (Hidden by default) -->
            <div id="admin-orders-panel" style="display: none;">
                <div class="admin-header">
                    <h1 class="admin-title">Order Management</h1>
                </div>

                <div class="admin-card">
                    <h3 style="margin-bottom: 1.5rem; font-family: var(--font-heading); font-size: 1.5rem;">Customer Orders</h3>
                    <table id="custom-orders-table" style="width: 100%;">
                        <thead>
                            <tr>
                                <th style="width: 80px;">Order ID</th>
                                <th style="width: 120px;">Date Placed</th>
                                <th>Order Details</th>
                                <th style="width: 100px;">Total</th>
                                <th style="width: 110px;">Status</th>
                                <th>Shipping Info</th>
                                <th style="width: 120px;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="custom-orders-tbody">
                            <!-- Rendered by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
